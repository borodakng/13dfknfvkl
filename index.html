<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111019">
    <title>Твой собеседник</title>
    <link rel="stylesheet" href="./app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">♡</div>
        <div>
          <p class="eyebrow">ТВОЯ ИСТОРИЯ НАЧИНАЕТСЯ ЗДЕСЬ</p>
          <h1>С кем познакомимся?</h1>
        </div>
        <span class="counter" id="counter" aria-live="polite"></span>
      </header>

      <nav class="catalog-tabs" aria-label="Фильтр персонажей">
        <button class="catalog-tab is-active" type="button" data-view="all" aria-pressed="true">Все</button>
        <button class="catalog-tab" type="button" data-view="favorites" aria-pressed="false">Избранное</button>
        <button class="catalog-tab" type="button" data-view="recent" aria-pressed="false">Недавние</button>
      </nav>

      <section class="deck" aria-label="Карточки персонажей">
        <div class="card-stack" id="card-stack">
          <div class="loading-card">Подбираю собеседников…</div>
        </div>
      </section>

      <p class="hint" id="hint">Листай влево и вправо, чтобы познакомиться</p>
      <div class="actions" id="actions" hidden>
        <button class="action action-start" id="choose" type="button" aria-label="Начать историю с персонажем">
          <span aria-hidden="true">✦</span>
          <span>Начать историю</span>
        </button>
        <button class="action action-profile" id="show-profile" type="button">Подробнее</button>
      </div>
      <p class="footnote">Выбери собеседника и открой новую историю</p>
    </main>

    <dialog class="profile-dialog" id="profile-dialog" aria-labelledby="profile-name">
      <div class="profile-panel">
        <button class="profile-close" id="close-profile" type="button" aria-label="Закрыть профиль">×</button>
        <img class="profile-image" id="profile-image" alt="">
        <div class="profile-placeholder" id="profile-placeholder" aria-hidden="true">♡</div>
        <div class="profile-content">
          <span class="tag" id="profile-style"></span>
          <h2 id="profile-name"></h2>
          <p id="profile-description"></p>
        </div>
      </div>
    </dialog>
  </body>
</html>
